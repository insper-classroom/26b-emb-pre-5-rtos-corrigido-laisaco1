name: exe2

on:
  push:
    paths:
      - 'exe2/main.c'

jobs:
  build-and-wokwi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: insper-embarcados/pico-build@v4
      - uses: insper-embarcados/actions-wokwi-test@v3
        timeout-minutes: 5
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          test_name: exe2
          time_out: 5000

  embedded-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: insper-embarcados/actions-embedded-check@v1
        with:
          c_file: exe2/main.c
          rtos: true

  cppcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: insper-embarcados/actions-cppcheck@v1
        with:
          c_file: exe2/main.c

  rubric-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: insper-embarcados/actions-firmware-rubric-check@v0
        with:
          c_file: exe2/main.c
